; desksessions firmware
;   native_test  unit tests on the Mac (core only)
;   sim          SDL2 simulator window on the Mac (core + ui)

[platformio]
default_envs = sim

[env]
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags = -std=c++20
lib_deps =
    etlcpp/Embedded Template Library@^20.49.0

[env:native_test]
platform = native
test_framework = googletest
lib_ignore = ui

[env:sim]
platform = native
build_type = debug
build_src_filter = +<sim/>
build_flags =
    ${env.build_flags}
    -O2
    -I${sysenv.HOMEBREW_PREFIX}/include/SDL2
    -L${sysenv.HOMEBREW_PREFIX}/lib
    -lSDL2
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@^1.2.32
