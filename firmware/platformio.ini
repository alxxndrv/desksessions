; desksessions firmware
;   native_test  unit tests on the Mac (core only)
;   sim          SDL2 simulator window on the Mac (core + ui)
;   t190         Heltec Vision Master T190 (ESP32-S3, ST7789 170×320)
;   t190_demo    the same, with a scripted pretend Mac instead of Bluetooth
;   t190_stats   the device build that prints frame timing over USB serial every 5 s

[platformio]
default_envs = sim

[env]
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags = -std=c++20
lib_deps =
    etlcpp/Embedded Template Library@^20.49.0

[env:native_test]
platform = native
test_framework = googletest
lib_ignore = ui, demo

[env:sim]
platform = native
build_type = debug
build_src_filter = +<sim/>
build_flags =
    ${env.build_flags}
    -O2
    -I${sysenv.HOMEBREW_PREFIX}/include/SDL2
    -L${sysenv.HOMEBREW_PREFIX}/lib
    -lSDL2
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@^1.2.32

[env:t190]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
monitor_speed = 115200
build_src_filter = +<esp32/>
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=3
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@^1.2.32
    h2zero/NimBLE-Arduino@^2.5.1

[env:t190_demo]
extends = env:t190
build_flags =
    ${env:t190.build_flags}
    -DDESK_DEMO

[env:t190_stats]
extends = env:t190
build_flags =
    ${env:t190.build_flags}
    -DDESK_FRAME_STATS
