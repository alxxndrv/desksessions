; desksessions firmware
; Envs: native_test (unit tests on the Mac). Device and simulator envs come later.

[platformio]
default_envs = native_test

[core]
build_flags =
    -std=c++20
    -Wall
    -Wextra
    -Wconversion
    -Wshadow
lib_deps =
    etlcpp/Embedded Template Library@^20.49.0

[env:native_test]
platform = native
test_framework = googletest
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
    ${core.build_flags}
    -Werror
    -DETL_NO_STL=0
lib_deps = ${core.lib_deps}
lib_ignore = ui
